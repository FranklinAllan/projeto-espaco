<!DOCTYPE html>
<html lang="pr-Br">
<head>
    <link rel="stylesheet" href="../assets/imagen.jpg" class="fav">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJETO-ESPAÇO</title>
    <link rel="stylesheet" href="style.css">

</head>
<body> 
    <div id="container">
        <div id="left-container" >
            <header id="header-container">
                <img src="../assets/images.jpg" alt="logo" width="25px" height="25px">
                <h1 id="header-title">Space</h1>
            </header>
            <main>   
                <div id="subtitle-page">   
                    <h2 id="welcome-text">Olá!!,<br>Bem vindo !!</h2>
                    <p id="hey-text">Vamos começar, nossa viagem pelo espaço sideral!</p>
                </div>                
                    <form onsubmit="alert('Enviado!')">
                        <div class="input-container">
                            <label>Email</label>
                            <input class="input-text" type="email" placeholder="Digite seu email!" required>                            
                        </div>
                        <div class="input-container">
                            <label>Senha</label>
                            <input class="input-text"  type="password" placeholder="Digite sua senha!" required>
                        </div>
                         
                        <div id="subtitle-login">   
                            <div id="checkbox-container">
                                <input type="checkbox">
                                <label id="remenber-label">Remenber-me</label>
                            </div>
                            
                            <a id="forgot-password" href="../esqueceuSenha/index.html">Esqueceu a senha?</a>
                        </div>
                        <button id="btn-sign" type="submit">Login</button>
                    </form>                                      
                
            </main>
            <footer>
                <p id="acount-text">
                    Não tem uma conta? <a id="signUp" href="http://www.google.com.br">Cadastre-se</a>
                </p>
            </footer>  
        </div>
                 
        <div id="right-container">

        </div>
    </div>
    
</body>
</html>
