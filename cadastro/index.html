<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro</title>
</head>
<body>
    <div id="container">
        <header id="header-container">
            <a href="../index.html">
                <img src="../assets/images.jpg" alt="logo" width="25px" height="25px">
            </a> 
            <h1 id="header-title">Space</h1>
        </header>
        <main id="main-container">
            <h2>
                <p>
                    Preencha os campos para se cadastrar:
                </p>
            </h2>
            <form onsubmit="alert('Cadastro realiazado com sucesso!')">
                <div class="input-container">
                    <p class="container-p">
                        <label class="label-text" for="name">Nome:</label>
                        <input class="input-text" type="text" id="name" name="name" required>
                    </p>
                    <p>    
                        <label class="label-text"  for="email">E-mail:</label>
                        <input  class="input-text" type="email" id="email" name="email" required>
                    </p>
                    <p>
                        <label class="label-text"  for="sexo">Sexo:</label>
                        <select class="input-text" aria-label="Default select example">
                            <option selected>-------------------------</option>
                            <option value="1">Feminino</option>
                            <option value="2">Masculino</option>                            
                        </select>
                        
                    </p>
                    
                    <p>
                        <label class="label-text"  for="endereço">endereço:</label>
                        <input  class="input-text" type="text" id="endereço" name="endereço" required>
                    </p>
                    <p>
                        <label  class="label-text" for="senha">Senha:</label>
                        <input  class="input-text" type="password" id="senha" name="senha" required>
                    </p>
                    <p>
                        <label  class="label-text" for="senha">Confirma senha:</label>
                        <input  class="input-text" type="password" id="senha" name="senha" required>
                    </p>
                    <p>
                        <a href="../login/index.html">
                            <button id="btn-cadastro" type="button">cadastrar</button>
                        </a>
                    </p>
                </div>
                
            </form>
        </main>
        <footer id="footer-container">
            <p>Todos os direitos reservados</p>
        </footer>
    </div>
    
</body>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</html>
